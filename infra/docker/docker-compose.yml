# Local dev only. Production uses Railway-managed Postgres + Redis.
# Lesson: pin all images by SHA digest in production.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: maki
      POSTGRES_PASSWORD: maki
      POSTGRES_DB: maki
    ports:
      - '5432:5432'
    volumes:
      - maki_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U maki']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - maki_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  maki_pg_data:
  maki_redis_data:
