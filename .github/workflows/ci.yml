name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 22
  PNPM_VERSION: 9.12.0

jobs:
  check:
    name: lint · typecheck · test · build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: maki
          POSTGRES_PASSWORD: maki
          POSTGRES_DB: maki_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: env audit
        run: pnpm check-env

      - name: format check
        run: pnpm format:check

      - name: typecheck
        run: pnpm typecheck

      - name: lint
        run: pnpm lint

      - name: test
        env:
          DATABASE_URL: postgres://maki:maki@localhost:5432/maki_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          APP_ENV: local
          JWT_PRIVATE_KEY: test-key-must-be-at-least-32-chars-long-okay
          JWT_PUBLIC_KEY: test-key-must-be-at-least-32-chars-long-okay
          CORS_ORIGINS: http://localhost:3000
        run: pnpm test

      - name: build
        run: pnpm build
